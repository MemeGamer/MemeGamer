# Our koi pond (scripts/koi.py): a pixel-art koi that swims, feeds and grows with public GitHub activity.
name: Koi

on:
  schedule:
    - cron: "20 0 * * *"   # just after midnight UTC, so the koi reflects the day that just ended
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml, scripts/koi.py, assets/pond.png, assets/koi-sprites.png, assets/koi-turn.png]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the koi pond
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          pip install --quiet pillow
          python scripts/koi.py
      - name: Commit the pond if it changed
        run: |
          git add koi/pond.gif
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: redraw the pond"
          git pull --quiet --rebase origin main
          git push --quiet
