# The koi pond comes from git-koi-pixel (https://github.com/MemeGamer/git-koi-pixel), pinned to v1.0.0.
name: Koi

on:
  schedule:
    - cron: "20 0 * * *"   # just after midnight UTC, so the koi reflects the day that just ended
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MemeGamer/git-koi-pixel@4b2a94d0c4c0394903015ba7073ab302849e759f # v1.0.0
        with:
          output: koi/pond.gif
      - name: Commit the pond if it changed
        run: |
          git add koi/pond.gif koi/palette.json
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: redraw the pond"
          git pull --quiet --rebase origin main
          git push --quiet
